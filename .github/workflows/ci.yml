name: CI/CD de scraping

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    name: Pruebas en Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q scraper.py test_scraper.py

      - name: Ejecutar pruebas
        run: python -m unittest discover -v

  publicar:
    name: Publicar paquete
    needs: validar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar paquete
        run: |
          mkdir paquete
          cp README.md requirements.txt scraper.py articulo.csv paquete/
          tar -czf scraper-evidencia.tar.gz -C paquete .

      - name: Guardar artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: scraper-evidencia
          path: scraper-evidencia.tar.gz
          if-no-files-found: error
